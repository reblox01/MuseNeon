name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every skill ships SKILL.md and skill.yaml
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          skills = sorted(Path("skills").glob("*/"))
          assert skills, "no skills found"
          for skill in skills:
              assert (skill / "SKILL.md").is_file(), f"missing SKILL.md in {skill}"
              assert (skill / "skill.yaml").is_file(), f"missing skill.yaml in {skill}"
          print(f"{len(skills)} skills OK")
          EOF
      - name: Client compiles when present
        run: |
          if [ -f custom-connectors/custom.neon/bin/client.py ]; then
            python3 -m py_compile custom-connectors/custom.neon/bin/client.py
            python3 custom-connectors/custom.neon/bin/client.py --help
            echo "client compiles and --help exits 0"
          else
            echo "client.py not written yet, skipping"
          fi
      - name: No secrets in repo
        run: |
          # Fail on a pasted key, surrogate value, or database password.
          # The patterns require a value after the prefix, so prose that
          # only names a prefix (like `hsurr:` in the docs) or a masked
          # URI (`postgresql://<role>:****@<host>`) does not trip the check.
          if grep -rInE 'hsurr:[A-Za-z0-9_-]{8,}|NEON_API_KEY=[A-Za-z0-9_-]{8,}|Authorization: Bearer [A-Za-z0-9_-]{20,}|postgresql://[^:/@ ]+:[A-Za-z0-9][A-Za-z0-9_-]{3,}@' --exclude-dir=.git .; then
            echo "possible secret found, see matches above"
            exit 1
          fi
          echo "no secrets found"
